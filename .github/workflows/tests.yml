# Windows · Linux · macOS 실제 컴퓨터에서 설치 스크립트와 전체 테스트를 돌린다.
# 가상 음성(samples/)은 macOS say 로 만들어 다른 OS 에 넘긴다. 실제 Claude 요약 테스트는 돌리지 않는다(가짜 claude).
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  samples:
    name: 가상 음성 만들기 (macOS say)
    runs-on: macos-latest
    # GitHub 의 Mac 에 한국어 음성(Yuna)이 없으면 실패한다. 그때도 나머지 테스트는 돌고, 음성이 필요한 테스트만 건너뛴다.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy soundfile soxr
      - run: python scripts/make_test_audio.py samples
      - uses: actions/upload-artifact@v4
        with:
          name: samples
          path: samples
          retention-days: 3

  test:
    needs: samples
    if: ${{ always() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-latest]
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux 시스템 꾸러미 (마이크·화면·한글 글꼴)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3 fonts-noto-cjk
      - name: 모델 캐시
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/clinic-scribe/models
            ~/AppData/Local/clinic-scribe/models
          key: models-v1
      - name: 설치 (scripts/setup.py — whisper.cpp 공식 빌드·모델 SHA-256 확인·자체 점검)
        # claude 가 없어 '막힌 단계'가 남는 것은 정상이다 (요약 테스트는 가짜 claude 를 쓴다)
        continue-on-error: true
        run: python scripts/setup.py --no-launcher
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: samples
          path: samples
      - name: 테스트
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          # GitHub 컴퓨터는 GPU 없이 CPU 4개라 전사가 느리다: 가짜 마이크를 실제 속도로, 기다리는 시간은 5배로
          CLINIC_SCRIBE_TEST_SPEED: "1"
          CLINIC_SCRIBE_TEST_PATIENCE: "5"
        run: |
          if [ -x .venv/bin/python ]; then PY=.venv/bin/python; else PY=.venv/Scripts/python.exe; fi
          # 테스트 하나가 5분을 넘으면 모든 스레드가 어디서 멈췄는지 로그에 남긴다
          "$PY" -m pytest -v -rs -o faulthandler_timeout=300
